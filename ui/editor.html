<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/tessera.css">
<link rel="stylesheet" href="/node_modules/@d3x0r/popups2/styles.css">
<link rel="stylesheet" href="css/editor.css">
<title>Tessera Trellis - Designer</title>
</head>
<body class="tt-editor">

<div id="toolbar" class="tt-toolbar">
	<label>Layer
		<select id="layer">
			<option value="page">Page</option>
			<option value="shared">Shared (header/footer)</option>
		</select>
	</label>
	<label>Page
		<select id="pages"></select>
	</label>
	<label>Grid
		<input id="divx" type="number" min="1" max="200" value="24" size="4">
		&times;
		<input id="divy" type="number" min="1" max="200" value="18" size="4">
	</label>
	<label title="Off = free placement at fine resolution (hold Alt to override)">
		<input id="snap" type="checkbox" checked> Snap
	</label>
	<span class="tt-sep"></span>
	<label title="Shell insets in grid cells: header, footer, left rail, right rail. A guide, not a wall.">Shell
		<input id="header" type="number" min="0" step="0.5" value="0" size="3" title="header">
		<input id="footer" type="number" min="0" step="0.5" value="0" size="3" title="footer">
		<input id="railL"  type="number" min="0" step="0.5" value="0" size="3" title="left rail">
		<input id="railR"  type="number" min="0" step="0.5" value="0" size="3" title="right rail">
	</label>
	<span class="tt-sep"></span>
	<button id="undo" disabled title="Undo (Ctrl+Z)">&#8630; Undo</button>
	<button id="redo" disabled title="Redo (Ctrl+Y)">&#8631; Redo</button>
	<span class="tt-sep"></span>
	<span id="status" class="tt-status">no selection</span>
	<span class="tt-grow"></span>
	<button id="pages-order" title="Reorder pages; this is also the attract-loop order">Pages</button>
	<button id="plugins" title="Which plugins this service loads">Plugins</button>
	<button id="load">Load</button>
	<button id="save">Save</button>
	<button id="dump">Show JSOX</button>
</div>

<div id="stage" class="tt-stage"></div>

<pre id="wire" class="tt-wire" hidden></pre>

<script type="importmap">
	{
		"imports": {
			"jsox": "/node_modules/jsox/lib/jsox.mjs",
			"sack.vfs/Events2": "/node_modules/sack.vfs/apps/events/events2.mjs",
			"@d3x0r/srg2": "/node_modules/@d3x0r/srg2/salty_random_generator2.mjs",
			"@d3x0r/popups2/menu": "/node_modules/@d3x0r/popups2/controls/menu.js",
			"@d3x0r/popups2": "/node_modules/@d3x0r/popups2/popups.js",
			"@d3x0r/popups2/controls/": "/node_modules/@d3x0r/popups2/controls/",
			"@d3x0r/popups2/forms/": "/node_modules/@d3x0r/popups2/forms/",
			"@d3x0r/popups2/core/": "/node_modules/@d3x0r/popups2/core/"
		}
	}
</script>

<script type="module" src="./editor.js"></script>
</body>
</html>
